<!doctype html>
<html lang="pt-BR">
  <head>
    <meta name="google-site-verification" content="fG5QCaoInVjyY9J3wa_ltbAq3V2tFIKWxEr8qsuph9Q" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050505" />

    <!-- meugasto-seo:head -->
    <!--
      SEO: esta SPA não tem SSR, então o HTML que o robô recebe é o que o build
      grava em disco. Title, description, canonical, Open Graph e JSON-LD deste
      trecho descrevem "/" — que é onde a landing é renderizada (ver RootRoute
      em src/App.tsx). __SITE_URL__ é trocado no build pelo plugin meugasto-seo
      (vite.config.ts), que lê o domínio de site.config.ts.

      Este comentário está DENTRO dos marcadores meugasto-seo:head de propósito:
      cada página pública temática troca o trecho marcado pelo <head> da sua
      própria rota (ver renderPublicPage em src/entry-prerender.tsx), e o que
      vale só para "/" não deve sobrar no HTML das outras. Não remova nem
      renomeie os marcadores — o build quebra de propósito se eles não
      estiverem aqui.
    -->
    <title>Central Motos | Sistema Financeiro</title>
    <meta name="description" content="Sistema financeiro da Central Motos: gastos, contas, cartões, parcelas e metas em um só lugar." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="__SITE_URL__/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Central Motos" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:url" content="__SITE_URL__/" />
    <meta property="og:title" content="Central Motos | Sistema Financeiro" />
    <meta property="og:description" content="Sistema financeiro da Central Motos: gastos, contas, cartões, parcelas e metas em um só lugar." />
    <!-- Ícone quadrado do PWA: é a única imagem de marca que existe hoje. Por
         isso o card do X é "summary" (quadrado), e não "summary_large_image". -->
    <meta property="og:image" content="__SITE_URL__/pwa-512x512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="Central Motos" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Central Motos | Sistema Financeiro" />
    <meta name="twitter:description" content="Sistema financeiro da Central Motos: gastos, contas, cartões, parcelas e metas em um só lugar." />
    <meta name="twitter:image" content="__SITE_URL__/pwa-512x512.png" />
    <!-- /meugasto-seo:head -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" sizes="any" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Central Motos" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- DM Sans self-hosted: pesos usados acima da dobra (landing) priorizados via preload -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/files/dm-sans-latin-400-normal.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/files/dm-sans-latin-500-normal.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/files/dm-sans-latin-700-normal.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/files/dm-sans-latin-800-normal.woff2" crossorigin />
    <!-- CSS de @font-face carregado de forma não bloqueante (evita segurar o first paint) -->
    <link rel="preload" as="style" href="/fonts/dm-sans.css" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="/fonts/dm-sans.css" /></noscript>

    <script>
      (function () {
        try {
          const theme =
            localStorage.getItem("theme") === "light" ? "light" : "dark";
          const root = document.documentElement;
          root.classList.add(theme);
          root.dataset.theme = theme;
          root.style.colorScheme = theme;

          const meta = document.querySelector('meta[name="theme-color"]');
          if (meta) {
            meta.setAttribute(
              "content",
              theme === "light" ? "#f5f5f5" : "#050505",
            );
          }
        } catch (error) {
          document.documentElement.classList.add("dark");
        }

        // Fonte dos títulos da landing e das páginas públicas temáticas: só
        // nessas rotas, para não pesar no app. Em "/" quem já tem sessão vai
        // direto pro /dashboard, então ali o preload só vale para visitante
        // deslogado. Navegações internas carregam o CSS pelo useLandingChrome.
        // __PUBLIC_PATHS__ é trocado no build pelo plugin meugasto-seo, a
        // partir de src/content/public-pages.ts.
        const isLanding =
          location.pathname === "/landing" ||
          __PUBLIC_PATHS__.indexOf(location.pathname) !== -1 ||
          (location.pathname === "/" &&
            !localStorage.getItem("contacerta.refreshToken"));
        if (isLanding) {
          const font = document.createElement("link");
          font.rel = "preload";
          font.as = "font";
          font.type = "font/woff2";
          font.href = "/fonts/files/bricolage-grotesque-latin-var.woff2";
          font.crossOrigin = "";
          document.head.appendChild(font);

          const css = document.createElement("link");
          css.rel = "stylesheet";
          css.href = "/fonts/bricolage-grotesque.css";
          document.head.appendChild(css);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>

    <!-- meugasto-seo:jsonld -->
    <!--
      Structured data de "/". Enquanto a landing estiver oculta (ver App.tsx),
      "/" leva o visitante deslogado direto para /login, então aqui fica só o
      mínimo verdadeiro: quem é a organização e quem construiu o sistema. Nada
      de preço nem de FAQ — isso descrevia a landing do MeuGasto e não existe
      mais nesta rota. Não remova nem renomeie os marcadores: o plugin
      meugasto-seo troca este trecho em cada página pré-renderizada e o build
      quebra de propósito se eles sumirem.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "__SITE_URL__/#website",
            "name": "Central Motos",
            "url": "__SITE_URL__/",
            "inLanguage": "pt-BR",
            "publisher": { "@id": "__SITE_URL__/#azuos" }
          },
          {
            "@type": "Organization",
            "@id": "__SITE_URL__/#central-motos",
            "name": "Central Motos",
            "url": "__SITE_URL__/",
            "areaServed": "Parazinho, Granja - CE, Brasil"
          },
          {
            "@type": "Organization",
            "@id": "__SITE_URL__/#azuos",
            "name": "Azuos Dev",
            "url": "https://azuos-dev.vercel.app/"
          }
        ]
      }
    </script>
    <!-- /meugasto-seo:jsonld -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
