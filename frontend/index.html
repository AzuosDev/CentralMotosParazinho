<!doctype html>
<html lang="pt-BR">
  <head>
    <meta name="google-site-verification" content="fG5QCaoInVjyY9J3wa_ltbAq3V2tFIKWxEr8qsuph9Q" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A0A0A" />

    <!--
      SEO: esta SPA não tem SSR, então este é o único HTML que o robô recebe.
      Title, description, canonical, Open Graph e JSON-LD ficam aqui, estáticos,
      e descrevem "/" — que é onde a landing é renderizada (ver RootRoute em
      src/App.tsx). __SITE_URL__ é trocado no build pelo plugin meugasto-seo
      (vite.config.ts), que lê o domínio de site.config.ts.
    -->
    <title>MeuGasto | Controle Financeiro Pessoal e de Gastos</title>
    <meta name="description" content="Controle seus gastos, contas, cartões, parcelas e metas em um só lugar. Conheça o MeuGasto, seu aplicativo de controle financeiro pessoal sem conexão com o banco." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="__SITE_URL__/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MeuGasto" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:url" content="__SITE_URL__/" />
    <meta property="og:title" content="MeuGasto | Controle Financeiro Pessoal e de Gastos" />
    <meta property="og:description" content="Controle seus gastos, contas, cartões, parcelas e metas em um só lugar. Conheça o MeuGasto, seu aplicativo de controle financeiro pessoal sem conexão com o banco." />
    <!-- Ícone quadrado do PWA: é a única imagem de marca que existe hoje. Por
         isso o card do X é "summary" (quadrado), e não "summary_large_image". -->
    <meta property="og:image" content="__SITE_URL__/pwa-512x512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="MeuGasto" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="MeuGasto | Controle Financeiro Pessoal e de Gastos" />
    <meta name="twitter:description" content="Controle seus gastos, contas, cartões, parcelas e metas em um só lugar. Conheça o MeuGasto, seu aplicativo de controle financeiro pessoal sem conexão com o banco." />
    <meta name="twitter:image" content="__SITE_URL__/pwa-512x512.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" sizes="any" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MeuGasto" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- DM Sans self-hosted: pesos usados acima da dobra (landing) priorizados via preload -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/files/dm-sans-latin-400-normal.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/files/dm-sans-latin-500-normal.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/files/dm-sans-latin-700-normal.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/files/dm-sans-latin-800-normal.woff2" crossorigin />
    <!-- CSS de @font-face carregado de forma não bloqueante (evita segurar o first paint) -->
    <link rel="preload" as="style" href="/fonts/dm-sans.css" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="/fonts/dm-sans.css" /></noscript>

    <script>
      (function () {
        try {
          const theme =
            localStorage.getItem("theme") === "light" ? "light" : "dark";
          const root = document.documentElement;
          root.classList.add(theme);
          root.dataset.theme = theme;
          root.style.colorScheme = theme;

          const meta = document.querySelector('meta[name="theme-color"]');
          if (meta) {
            meta.setAttribute(
              "content",
              theme === "light" ? "#f3f3f0" : "#0a0a0a",
            );
          }
        } catch (error) {
          document.documentElement.classList.add("dark");
        }

        // Fonte dos títulos da landing: só nessas rotas, para não pesar no app.
        // Em "/" quem já tem sessão vai direto pro /dashboard, então o preload
        // só vale para visitante deslogado. Navegações internas até a landing
        // carregam o CSS pelo próprio LandingPage.
        const isLanding =
          location.pathname === "/landing" ||
          (location.pathname === "/" &&
            !localStorage.getItem("contacerta.refreshToken"));
        if (isLanding) {
          const font = document.createElement("link");
          font.rel = "preload";
          font.as = "font";
          font.type = "font/woff2";
          font.href = "/fonts/files/bricolage-grotesque-latin-var.woff2";
          font.crossOrigin = "";
          document.head.appendChild(font);

          const css = document.createElement("link");
          css.rel = "stylesheet";
          css.href = "/fonts/bricolage-grotesque.css";
          document.head.appendChild(css);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>

    <!--
      Structured data. Só descreve o que a landing realmente mostra: o produto,
      os preços do plano Básico e as perguntas da seção "Dúvidas". Se as FAQs de
      src/pages/LandingPage.tsx mudarem, atualize o FAQPage aqui — o markup
      precisa bater com o texto visível na página.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "__SITE_URL__/#website",
            "name": "MeuGasto",
            "alternateName": "MeuGasto - Controle Financeiro",
            "url": "__SITE_URL__/",
            "inLanguage": "pt-BR",
            "publisher": {
              "@id": "__SITE_URL__/#azuos"
            }
          },
          {
            "@type": "Organization",
            "@id": "__SITE_URL__/#azuos",
            "name": "Azuos Dev",
            "url": "https://azuos-dev.vercel.app/"
          },
          {
            "@type": [
              "SoftwareApplication",
              "WebApplication"
            ],
            "@id": "__SITE_URL__/#app",
            "name": "MeuGasto",
            "url": "__SITE_URL__/",
            "applicationCategory": "FinanceApplication",
            "applicationSubCategory": "Controle financeiro pessoal",
            "operatingSystem": "Web",
            "browserRequirements": "Requer JavaScript",
            "inLanguage": "pt-BR",
            "image": "__SITE_URL__/pwa-512x512.png",
            "description": "Aplicativo de controle financeiro pessoal para acompanhar contas, carteiras, cartão de crédito, gastos, parcelas e metas em um só lugar, sem conectar diretamente ao banco. Os lançamentos são feitos manualmente ou por importação de extrato OFX.",
            "featureList": [
              "Saldo consolidado de contas e carteiras",
              "Controle de cartão de crédito com faturas e parcelamentos",
              "Pagamentos parciais e estornos",
              "Categorias de gastos",
              "Importação de extrato bancário em OFX",
              "Contas a pagar e contas a receber",
              "Lançamentos recorrentes e lembretes",
              "Metas financeiras",
              "Login biométrico"
            ],
            "publisher": {
              "@id": "__SITE_URL__/#azuos"
            },
            "offers": [
              {
                "@type": "Offer",
                "name": "Básico mensal",
                "price": "29.90",
                "priceCurrency": "BRL",
                "category": "subscription",
                "url": "__SITE_URL__/#precos"
              },
              {
                "@type": "Offer",
                "name": "Básico anual",
                "price": "299.90",
                "priceCurrency": "BRL",
                "category": "subscription",
                "url": "__SITE_URL__/#precos"
              }
            ]
          },
          {
            "@type": "FAQPage",
            "@id": "__SITE_URL__/#duvidas",
            "inLanguage": "pt-BR",
            "mainEntity": [
              {
                "@type": "Question",
                "name": "Como funciona o teste grátis de 15 dias?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Você cria sua conta e usa o app completo por 15 dias sem pagar nada. Só pedimos pagamento se você decidir continuar."
                }
              },
              {
                "@type": "Question",
                "name": "Preciso conectar minha conta bancária?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Não. Você cadastra suas transações manualmente ou importa o extrato do seu banco via arquivo OFX. O MeuGasto não acessa sua conta bancária diretamente."
                }
              },
              {
                "@type": "Question",
                "name": "Como cancelo?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "A qualquer momento, direto nas configurações da sua conta, sem precisar ligar ou mandar e-mail."
                }
              },
              {
                "@type": "Question",
                "name": "Meus dados financeiros estão seguros?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Toda comunicação é criptografada (HTTPS) e o login biométrico não expõe sua senha na rede. Veja mais na seção de Segurança acima."
                }
              },
              {
                "@type": "Question",
                "name": "Qual a diferença entre o plano Básico e o Empresarial?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "O Básico dá acesso completo ao MeuGasto para uso pessoal, com assinatura direta pelo app. O Empresarial é uma versão personalizada para o seu negócio, com manutenções corretivas prioritárias e atualizações dedicadas. O valor final e o escopo são definidos em conversa com nosso time."
                }
              },
              {
                "@type": "Question",
                "name": "Posso trocar entre mensal e anual depois de assinar?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Sim. No plano Básico, você troca entre mensal e anual quando quiser, direto nas configurações da conta, e a mudança vale a partir do próximo ciclo de cobrança. No Empresarial, qualquer ajuste é combinado direto com nosso time."
                }
              },
              {
                "@type": "Question",
                "name": "O teste grátis de 15 dias vale para qual plano?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Só para o plano Básico. O Empresarial funciona por consulta comercial, fale com a gente pra montar a melhor proposta pro seu negócio."
                }
              }
            ]
          }
        ]
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
